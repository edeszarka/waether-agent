[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "simple-agent-telekom"
version = "0.1.0"
description = "A minimal LLM-driven agent for answering current-temperature questions."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
